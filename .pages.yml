settings:
  content:
    merge: true

media:
  input: src/images
  output: /images
  extensions: [avif, jpg, jpeg, png, webp]
  rename: true

content:
  - name: site
    label: Site Branding
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - name: logo
        label: Header Logo (Shown on Every Page)
        type: image
        required: true
      - name: logoAlt
        label: Header Logo Alt Text
        type: string
      - name: favicon
        label: Browser Tab Icon (Favicon)
        type: image

  - name: home
    label: Home Page
    type: file
    path: src/index.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: layouts/home.njk
      - name: pageClass
        type: string
        hidden: true
        default: page-home
      - name: title
        label: Browser Tab Title
        type: string
        hidden: true
      - name: description
        label: Search Description (SEO)
        type: text
      - name: diagramImage
        label: Bottom Diagram Image
        type: image
      - name: diagramAlt
        label: Bottom Image Description (Alt Text)
        type: string
      - name: body
        label: Home Page Text
        type: rich-text
        options:
          format: markdown
          media: false

  - name: merchandise
    label: Merchandise Page
    type: file
    path: src/merchandise.md
    format: yaml-frontmatter
    fields:
      - name: layout
        type: string
        hidden: true
        default: layouts/merchandise.njk
      - name: pageClass
        type: string
        hidden: true
        default: page-merchandise
      - name: title
        label: Browser Tab Title
        type: string
        hidden: true
      - name: description
        label: Search Description (SEO)
        type: text
      - name: body
        label: Merchandise Page Text
        type: rich-text
        options:
          format: markdown
          media: false
      - name: gallery
        label: Store Photos
        type: image
        options:
          multiple: true

  - name: events
    label: Events & Classes
    type: collection
    path: src/events
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["events.json"]
    view:
      primary: title
      fields: [title, dateText, order, active]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Event Title
        type: string
        required: true
      - name: dateText
        label: Date (Optional)
        type: string
      - name: timeText
        label: Time (Optional)
        type: string
      - name: image
        label: Event Image (Optional)
        type: image
      - name: imageAlt
        label: Event Image Description (Alt Text)
        type: string
      - name: order
        label: Display Order
        type: number
        default: 1
      - name: active
        label: Show on Website
        type: boolean
        default: true
      - name: body
        label: Description
        type: rich-text
        options:
          format: markdown
          media: false

  - name: practitioners
    label: Practitioners
    type: collection
    path: src/practitioners
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["practitioners.json"]
    view:
      primary: name
      fields: [name, buttonText, order, active]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Practitioner Name
        type: string
        required: true
      - name: photo
        label: Photo / Logo
        type: image
      - name: photoAlt
        label: Photo Description (Alt Text)
        type: string
      - name: buttonText
        label: Button Label
        type: string
      - name: buttonUrl
        label: Button Link (URL)
        type: string
      - name: order
        label: Display Order
        type: number
        default: 1
      - name: active
        label: Show on Website
        type: boolean
        default: true
      - name: body
        label: Bio & Services
        type: rich-text
        options:
          format: markdown
          media: false

  - name: posts
    label: Blog Posts
    type: collection
    path: src/blog/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["posts.json"]
    view:
      primary: title
      fields: [title, author, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Post Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        default: "Lisa Bernarde"
      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: image
        label: Post Image & Cover Thumbnail
        type: image
      - name: imageAlt
        label: Image Description (Alt Text)
        type: string
      - name: imagePosition
        label: Show Image Inside Post
        type: select
        default: bottom
        options:
          values:
            - label: Bottom of Post
              value: bottom
            - label: Top of Post
              value: top
            - label: Thumbnail Only (Hide Inside Post)
              value: none
      - name: body
        label: Post Text
        type: rich-text
        options:
          format: markdown
          media: false
